name: N64 Rasterizer

# parallel-rdp's SMALL_TYPES=0 rasterizer as rasterizer_patched.hpp carries it (tools/parallel-rdp/patch_rasterizer.py
# says what the patch is and why): the header must be what the script makes from slangmosh.hpp, byte for byte, and
# the script refuses a slangmosh.hpp whose rasterizer isn't the one the patch was made for; then check_rasterizer.py
# validates the patched module for Vulkan 1.1 and 1.3, finds no stored specialization-constant operation left in its
# shade_pixel, and, with both modules specialized alike (the app's generic and fill pipelines and four random
# specializations), finds each of the 24 rewritten stores storing the same constant and the optimized programs the
# same. SPIRV-Tools comes from the image's apt: Ubuntu 24.04's 2025.1 has every spirv-opt option the check uses. The
# paths are what the job reads or runs: the shaders folder (slangmosh.hpp and the header), the two scripts and this
# file.

on:
  push:
    branches: [ master ]
    paths: [ 'ares/n64/vulkan/parallel-rdp/parallel-rdp/shaders/**', 'tools/parallel-rdp/**',
             '.github/workflows/n64-rasterizer.yml' ]
  pull_request:
    paths: [ 'ares/n64/vulkan/parallel-rdp/parallel-rdp/shaders/**', 'tools/parallel-rdp/**',
             '.github/workflows/n64-rasterizer.yml' ]
  workflow_dispatch:

concurrency:
  # (a PR's newer push replaces its run; every other run is a group of its own: see psp-core.yml)
  group: n64-rasterizer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rasterizer:
    name: Patched rasterizer checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends spirv-tools
          python3 --version
          spirv-opt --version

      - name: rasterizer_patched.hpp is what the script makes
        run: python3 -B tools/parallel-rdp/patch_rasterizer.py --check

      # (bash named, so a failing check fails the step through tee: pipefail)
      - name: The patched module, checked with SPIRV-Tools
        shell: bash
        run: python3 -B tools/parallel-rdp/check_rasterizer.py 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/check.log" 2> /dev/null || true)
          echo "- tools/parallel-rdp at $at: ${last:-no output: the check did not run}" >> "$GITHUB_STEP_SUMMARY"
