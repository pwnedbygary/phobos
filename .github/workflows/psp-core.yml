name: PSP Core Tests

# The PSP core (ares/psp) tested on the host, in four suites: the Allegrex CPU's (tests/allegrex) and the system's
# parts (tests/psp), both with the address and undefined-behavior sanitizers; the whole core as an ares system, as
# Phobos builds it (tests/psp/ares/run-tests.sh); and the headless runner, built and running a test program
# (tests/psp/ares/runner-test.sh), and built for Android as an artifact to run on a phone
# (tools/psp-runner/build-android.sh). Their paths are what those builds compile or read: the core, nall, ares's
# framework and libco, sljit and its configuration, Vulkan's headers, libchdr, FFmpeg's build, the runner, the
# desktop's disc reader, the tests, and the files the PSP's tests share with the app's
# (android/app/src/test/resources/psp-*: the dialogs' byte form, the keyboard's cases). The CPU's suite runs on an
# ARM64 host too, and again built as the app's release builds are (PHOBOS_TESTS_MODE=release), beside the sanitized
# runs; the system's, built so, is a lane of its own.
# A version tag runs every suite (a tag's push takes no path filter). The runners are pinned to Ubuntu 24.04 (its
# GCC 13), so a new image is a change made on purpose. Each suite's last line, its count, goes in the run's summary
# with the commit; the x86-64 Allegrex lane's sanitized run and both system lanes keep their groups' results (pass,
# FAIL or skip with why) as artifacts (allegrex-report, psp-report, psp-report-release). What a lane must have is
# named in PHOBOS_TESTS_REQUIRE (tests/allegrex/harness.hpp's skip()): without it, a group that needs it fails
# instead of skipping.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths: [ 'ares/psp/**', 'ares/ares/**', 'nall/**', 'libco/**', 'thirdparty/sljit/**', 'thirdparty/sljit*',
             'thirdparty/Vulkan-Headers/**', 'thirdparty/libchdr/**', 'thirdparty/ffmpeg/**', 'tools/psp-runner/**',
             'tests/allegrex/**', 'tests/psp/**', 'tests/objects*.sh', 'desktop/PspDiscInfo.*', 'desktop/Platform.hpp',
             'android/app/src/test/resources/psp-*',
             '.github/workflows/psp-core.yml' ]
  pull_request:
    paths: [ 'ares/psp/**', 'ares/ares/**', 'nall/**', 'libco/**', 'thirdparty/sljit/**', 'thirdparty/sljit*',
             'thirdparty/Vulkan-Headers/**', 'thirdparty/libchdr/**', 'thirdparty/ffmpeg/**', 'tools/psp-runner/**',
             'tests/allegrex/**', 'tests/psp/**', 'tests/objects*.sh', 'desktop/PspDiscInfo.*', 'desktop/Platform.hpp',
             'android/app/src/test/resources/psp-*',
             '.github/workflows/psp-core.yml' ]
  workflow_dispatch:

concurrency:
  # a PR's newer push replaces its run; every other run (master's, a tag's, a dispatch) is a group of its own, so none
  # waits behind or is cancelled by another, and each commit keeps its result
  group: psp-core-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  allegrex:
    name: Allegrex CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tests/objects.sh, which keeps every suite's objects, on its own small program (seconds)
      - name: Check the build scripts' object keeping
        run: tests/objects-test.sh

      # (bash named, so a failing suite fails the step through tee: pipefail)
      - name: Run the tests
        shell: bash
        env:
          PHOBOS_TESTS_REPORT: ${{ runner.temp }}/allegrex-report.tsv
        run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Keep the groups' results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allegrex-report
          path: ${{ runner.temp }}/allegrex-report.tsv
          if-no-files-found: warn

      # again built as the app's release builds are (PHOBOS_TESTS_MODE=release: BUILD_RELEASE, -O3, no sanitizers),
      # whether or not the sanitized run passed
      - name: Run the tests, built as the app is
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PHOBOS_TESTS_MODE: release
        run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite-release.log"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/suite.log" 2> /dev/null || true)
          release=$(tail -1 "$RUNNER_TEMP/suite-release.log" 2> /dev/null || true)
          echo "- tests/allegrex at $at: ${last:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tests/allegrex, release build: ${release:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"

  # The same on an ARM64 host, where the recompiler emits ARM64 code as it does on the phones (sljit's ARM64 back
  # end; Linux's ABI, not Android's): sanitized, then built as the app is
  allegrex-arm64:
    name: Allegrex CPU tests (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The host
        run: |
          uname -m
          c++ --version | head -1
          [[ $(uname -m) == aarch64 ]] || { echo "this lane is for an ARM64 host; it got $(uname -m)"; exit 1; }

      - name: Run the tests
        shell: bash
        run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Run the tests, built as the app is
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PHOBOS_TESTS_MODE: release
        run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite-release.log"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          host="$(uname -m), $(c++ --version | head -1)"
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/suite.log" 2> /dev/null || true)
          release=$(tail -1 "$RUNNER_TEMP/suite-release.log" 2> /dev/null || true)
          echo "- tests/allegrex on $host at $at: ${last:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tests/allegrex on $host, release build: ${release:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"

  system:
    name: PSP system tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FFmpeg's decoders for the host (thirdparty/ffmpeg/build.sh, run by the test script), built once and kept:
      # keyed on the build's own name (the script, the system and the compiler), so a runner's new compiler makes a
      # new build that's kept in turn
      - name: Name the FFmpeg build
        id: ffmpeg
        run: echo "name=$(thirdparty/ffmpeg/build.sh --name host)" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.name }}
          restore-keys: ffmpeg-${{ runner.os }}-host-

      # The GPU renderer's tests (tests/psp/gpu.cpp) on Mesa's Vulkan driver that draws on the CPU (lavapipe), which
      # the renderer takes only when asked (PSP_GPU_ON_CPU)
      - name: Install Mesa's software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1

      # Required: a Vulkan GPU (lavapipe) with each capability of it the tests use that lavapipe has (not
      # vulkan-unordered-reads: it reads in order), the test programs, and the GE's measurements (rounds 3 and 6)
      - name: Run the tests
        shell: bash
        env:
          PSP_GPU_ON_CPU: 1
          PHOBOS_TESTS_REQUIRE: >-
            vulkan, vulkan-fast, vulkan-transforms, vulkan-palettes, vulkan-moves, vulkan-reads, vulkan-2x, vulkan-3x,
            vulkan-stencil-export, programs, ge-round3, ge-round6
          PHOBOS_TESTS_REPORT: ${{ runner.temp }}/psp-report.tsv
        run: tests/psp/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Keep the groups' results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: psp-report
          path: ${{ runner.temp }}/psp-report.tsv
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/suite.log" 2> /dev/null || true)
          echo "- tests/psp at $at: ${last:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"

  # tests/psp again built as the app's release builds are (PHOBOS_TESTS_MODE=release: BUILD_RELEASE, -O3, no
  # sanitizers), with the same requirements. GCC 13 at -O3 -Werror rejected four of its files with false positives,
  # each settled in the code, not the flags (the handoff's package 06 entry): four.cpp's sprite fours,
  # serialization.cpp's right stick, pspIconKey()'s digest (desktop/PspDiscInfo.cpp) and crypto.cpp's put32().
  system-release:
    name: PSP system tests, built as the app is
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FFmpeg's decoders for the host (thirdparty/ffmpeg/build.sh, run by the test script), built once and kept:
      # keyed on the build's own name (the script, the system and the compiler), so a runner's new compiler makes a
      # new build that's kept in turn
      - name: Name the FFmpeg build
        id: ffmpeg
        run: echo "name=$(thirdparty/ffmpeg/build.sh --name host)" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.name }}
          restore-keys: ffmpeg-${{ runner.os }}-host-

      # The GPU renderer's tests (tests/psp/gpu.cpp) on Mesa's Vulkan driver that draws on the CPU (lavapipe), which
      # the renderer takes only when asked (PSP_GPU_ON_CPU)
      - name: Install Mesa's software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1

      # Required: a Vulkan GPU (lavapipe) with each capability of it the tests use that lavapipe has (not
      # vulkan-unordered-reads: it reads in order), the test programs, and the GE's measurements (rounds 3 and 6).
      # Four compiles at once: then a failed one lets the others finish, so one run shows every file's errors.
      - name: Run the tests
        shell: bash
        env:
          PHOBOS_TESTS_MODE: release
          PHOBOS_JOBS: 4
          PSP_GPU_ON_CPU: 1
          PHOBOS_TESTS_REQUIRE: >-
            vulkan, vulkan-fast, vulkan-transforms, vulkan-palettes, vulkan-moves, vulkan-reads, vulkan-2x, vulkan-3x,
            vulkan-stencil-export, programs, ge-round3, ge-round6
          PHOBOS_TESTS_REPORT: ${{ runner.temp }}/psp-report-release.tsv
        run: tests/psp/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Keep the groups' results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: psp-report-release
          path: ${{ runner.temp }}/psp-report-release.tsv
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/suite.log" 2> /dev/null || true)
          echo "- tests/psp, release build, at $at: ${last:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"

  # The whole core as an ares system, with ares's node tree, libco and libchdr, as Phobos builds it: system.cpp's
  # checks, which boot the test programs in tests/psp/programs (no Vulkan: they draw with the software renderer)
  ares:
    name: PSP as an ares system
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Name the FFmpeg build
        id: ffmpeg
        run: echo "name=$(thirdparty/ffmpeg/build.sh --name host)" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.name }}
          restore-keys: ffmpeg-${{ runner.os }}-host-

      - name: Run the tests
        shell: bash
        env:
          PHOBOS_TESTS_REQUIRE: programs
        run: tests/psp/ares/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/suite.log" 2> /dev/null || true)
          echo "- tests/psp/ares at $at: ${last:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"

  # tools/psp-runner built as tools/psp-runner/build.sh builds it, running cube.elf for 60 frames: its summary, PNGs
  # and WAV checked
  runner:
    name: Headless runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Name the FFmpeg build
        id: ffmpeg
        run: echo "name=$(thirdparty/ffmpeg/build.sh --name host)" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.name }}
          restore-keys: ffmpeg-${{ runner.os }}-host-

      - name: Run the test
        shell: bash
        run: tests/psp/ares/runner-test.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          at="${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}"
          last=$(tail -1 "$RUNNER_TEMP/suite.log" 2> /dev/null || true)
          echo "- tests/psp/ares/runner-test.sh at $at: ${last:-no output: the suite did not run}" >> "$GITHUB_STEP_SUMMARY"

  # tools/psp-runner built for Android as tools/psp-runner/build-android.sh builds it (the app's NDK, flags and
  # flavor, arm64-v8a), checked to be what a phone's adb shell runs, and kept as an artifact to run on a device
  # (tools/psp-runner/README.md); the measurements it carries tested on this host (Linux's /proc, pinning, counters)
  runner-android:
    name: Headless runner for Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # (the history, for the build's name: git describe)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # the app's NDK (.github/workflows/android.yml)
      - name: Install the NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;28.2.13676358"

      # FFmpeg's decoders for arm64-v8a at the app's API level: the app's build's cache (android.yml), by its name
      - name: Name the FFmpeg build
        id: ffmpeg
        run: echo "name=$(thirdparty/ffmpeg/build.sh --name android "$ANDROID_SDK_ROOT/ndk/28.2.13676358" 26)" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.name }}
          restore-keys: ffmpeg-${{ runner.os }}-android-

      - name: Build and check
        id: build
        env:
          PHOBOS_FFMPEG_CACHE: ${{ github.workspace }}/.cache/ffmpeg
          PHOBOS_ANDROID_WORK: ${{ runner.temp }}/runner-android
          PHOBOS_JOBS: 4
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358
          folder=$(tools/psp-runner/build-android.sh | tail -1)
          tools/psp-runner/android/check-build.sh "$folder"
          cat "$folder/build.txt"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$folder")" >> "$GITHUB_OUTPUT"

      # (the counters allowed for the test, as a phone allows them after setprop security.perf_harden 0; the VM may
      # have no hardware ones, which the test says and doesn't need)
      - name: Test the measurements on this host
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          tools/psp-runner/android/measure-test.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: psp-runner-android-${{ steps.build.outputs.name }}
          path: |
            ${{ steps.build.outputs.folder }}/psp-runner-android
            ${{ steps.build.outputs.folder }}/lib
            ${{ steps.build.outputs.folder }}/build.txt
          if-no-files-found: error

  # The measurements on an ARM64 host's kernel, as a phone's: its CPU PMUs in sysfs, their counters on one thread
  runner-measure-arm64:
    name: Runner measurements (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the measurements
        run: |
          uname -m
          ls /sys/bus/event_source/devices
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          tools/psp-runner/android/measure-test.sh
