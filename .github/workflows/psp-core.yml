---
name: PSP Core Tests
on:
  push:
    branches:
    - master
    tags:
    - v*
    paths:
    - ares/psp/**
    - ares/ares/**
    - nall/**
    - libco/**
    - thirdparty/sljit/**
    - thirdparty/sljit*
    - thirdparty/Vulkan-Headers/**
    - thirdparty/libchdr/**
    - thirdparty/ffmpeg/**
    - tools/psp-runner/**
    - tests/allegrex/**
    - tests/psp/**
    - tests/objects*.sh
    - desktop/PspDiscInfo.*
    - android/app/src/test/resources/psp-*
    - ".github/workflows/psp-core.yml"
  pull_request:
    paths:
    - ares/psp/**
    - ares/ares/**
    - nall/**
    - libco/**
    - thirdparty/sljit/**
    - thirdparty/sljit*
    - thirdparty/Vulkan-Headers/**
    - thirdparty/libchdr/**
    - thirdparty/ffmpeg/**
    - tools/psp-runner/**
    - tests/allegrex/**
    - tests/psp/**
    - tests/objects*.sh
    - desktop/PspDiscInfo.*
    - android/app/src/test/resources/psp-*
    - ".github/workflows/psp-core.yml"
  workflow_dispatch: 
concurrency:
  group: psp-core-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  allegrex:
    name: Allegrex CPU tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Check the build scripts' object keeping
      run: tests/objects-test.sh
    - name: Run the tests
      shell: bash
      env:
        PHOBOS_TESTS_REPORT: "${{ runner.temp }}/allegrex-report.tsv"
      run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
    - name: Keep the groups' results
      if: "${{ !cancelled() }}"
      uses: actions/upload-artifact@v4
      with:
        name: allegrex-report
        path: "${{ runner.temp }}/allegrex-report.tsv"
        if-no-files-found: warn
    - name: Run the tests, built as the app is
      if: "${{ !cancelled() }}"
      shell: bash
      env:
        PHOBOS_TESTS_MODE: release
      run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite-release.log"
    - name: Summary
      if: "${{ !cancelled() }}"
      env:
        HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
      run: |
        echo "- tests/allegrex at ${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}: $(tail -1 "$RUNNER_TEMP/suite.log")" >> "$GITHUB_STEP_SUMMARY"
        echo "- tests/allegrex, release build: $(tail -1 "$RUNNER_TEMP/suite-release.log" 2> /dev/null)" >> "$GITHUB_STEP_SUMMARY"
  allegrex-arm64:
    name: Allegrex CPU tests (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: The host
      run: |
        uname -m
        c++ --version | head -1
    - name: Run the tests
      shell: bash
      run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
    - name: Run the tests, built as the app is
      if: "${{ !cancelled() }}"
      shell: bash
      env:
        PHOBOS_TESTS_MODE: release
      run: tests/allegrex/run-tests.sh 2>&1 | tee "$RUNNER_TEMP/suite-release.log"
    - name: Summary
      if: "${{ !cancelled() }}"
      env:
        HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
      run: |
        host="$(uname -m), $(c++ --version | head -1)"
        echo "- tests/allegrex on $host at ${GITHUB_SHA::9}${HEAD_SHA:+ (the PR head ${HEAD_SHA::9}, merged)}: $(tail -1 "$RUNNER_TEMP/suite.log")" >> "$GITHUB_STEP_SUMMARY"
        echo "- tests/allegrex on $host, release build: $(tail -1 "$RUNNER_TEMP/suite-release.log" 2> /dev/null)" >> "$GITHUB_STEP_SUMMARY"
