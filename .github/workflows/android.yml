name: Android Build

# Phobos is Android-only for now: build the release APKs (legacy + modern
# flavors) on every commit/PR, upload them as build artifacts, publish a GitHub
# Release when a version tag is pushed, and publish a nightly pre-release for
# every push to master. Every release carries update.json for the in-app updater.
# The app's JVM unit tests (android/app/src/test) run beside the build for both
# flavors; neither the release nor the nightly is published unless they pass.
#
# Only RELEASE builds are produced here — debug builds stay local/off-CI so
# nobody gets the dev build from GitHub.
#
# The release build type signs with android/keystore/release.keystore, which is
# committed with the default passwords in android/app/build.gradle.kts, so CI and
# local release APKs install over each other. That key is public; for private
# release signing, provide PHOBOS_KEYSTORE_FILE, PHOBOS_KEYSTORE_PASSWORD,
# PHOBOS_KEY_ALIAS and PHOBOS_KEY_PASSWORD from secrets (the build reads them).

on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]   # tag pushes also trigger so the release job can run
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APKs (legacy + modern)
    runs-on: ubuntu-latest
    # (about 20 minutes; the limit ends a hung step rather than leaving it for hours)
    timeout-minutes: 60
    steps:
      # The whole history, without file contents beyond this commit's: the build
      # numbers its version from the commit count and the latest tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive   # thirdparty/libadrenotools (public)
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Pre-install the same components the local build uses (compileSdk 37,
      # build-tools 36, NDK 28.2, CMake 3.22.1). AGP auto-installs anything
      # extra it needs on top. NOTE: the platform-37 package id is
      # "platforms;android-37.0" (Android 17, API level 37.0) — not "android-37".
      # Not cached: the runner's image has the platform and build tools, and the
      # NDK and CMake download in 20 s to a minute. A cache of the SDK folder (the
      # image's whole SDK, 4.6 GiB packed) took 13 to 59 minutes to save after a
      # miss (twice still saving when the next push cancelled the run, so that
      # commit got no nightly), and on a hit 2 to 5 minutes to fail to restore (tar
      # can't set the times and modes of the image's root-owned folders).
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # FFmpeg's decoders for the PSP (thirdparty/ffmpeg/build.sh, run by CMake): built from FFmpeg's release
      # once, then kept, as is the release's tarball. Keyed on the build's own name (the script and the NDK's
      # revision, API level 26: minSdk), so a new NDK makes a new build that's kept in turn.
      - name: Name the FFmpeg build
        id: ffmpeg
        run: echo "name=$(thirdparty/ffmpeg/build.sh --name android "$ANDROID_SDK_ROOT/ndk/28.2.13676358" 26)" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffmpeg.outputs.name }}
          restore-keys: ffmpeg-${{ runner.os }}-android-

      # assembleRelease = assembleLegacyRelease + assembleModernRelease.
      # CMake builds the native lib (ares fork + libadrenotools) for arm64-v8a.
      # The version comes from git history (android/app/build.gradle.kts): the
      # tag on a tagged commit (v1.2.3 -> 1.2.3), otherwise "<tag>-<n>-g<hash>".
      - name: Build release APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # "Phobos-<version>-<Flavor>.apk" for each flavor (no zip: each is its own
      # file on the Release page), and update.json for the in-app updater.
      - name: Stage release APKs
        working-directory: android
        run: >-
          bash ../.github/scripts/stage-apks.sh app/build/outputs/apk dist
          ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'nightly' }} "$GITHUB_SHA"

      # FFmpeg's source, the release tarball the APKs' libavcodec and libavutil were built from, published with
      # them: the LGPL's terms for distributing its libraries (LICENSE, FFmpeg).
      - name: Stage FFmpeg's source
        run: cp .cache/ffmpeg/ffmpeg-*.tar.xz android/dist/

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: phobos-apks
          path: android/dist/*
          if-no-files-found: error

  # The app's JVM unit tests, each flavor's (the debug variants, as run locally:
  # cd android && ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --continue).
  # They load no native library, so no APK or NDK build is needed; --continue
  # runs the second flavor's even when the first fails. The XML and HTML reports
  # are kept as an artifact, failing or not. No APK is uploaded from this job.
  unit-tests:
    name: Unit tests (legacy + modern)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # As the build checks out: the version comes from the history here too.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # The build's components, so the project configures the same way.
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        working-directory: android
        run: ./gradlew :app:testLegacyDebugUnitTest :app:testModernDebugUnitTest --continue --no-daemon --stacktrace

      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/test-results/
            android/app/build/reports/tests/
          if-no-files-found: warn

  # Publish a GitHub Release only for version tags (e.g. v1.0). Attaches the
  # two release APKs and update.json. Tag the repo with a version to cut a release.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, unit-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: phobos-apks
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*
          generate_release_notes: true

  # Every push to master publishes a pre-release, nightly-<version code>, for the
  # in-app updater's nightly channel; nightlies beyond the newest three are
  # deleted with their tags.
  nightly:
    name: Publish nightly build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build, unit-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: phobos-apks
          path: apks

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(jq -r .versionCode apks/update.json)
          name=$(jq -r .versionName apks/update.json)
          if ! gh release view "nightly-$code" > /dev/null 2>&1; then
            gh release create "nightly-$code" apks/* --prerelease --target "$GITHUB_SHA" \
              --title "Nightly $name" \
              --notes "Built from $GITHUB_SHA on master. Nightly builds are less tested than releases. The PlayStation Portable core is experimental."
          fi
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName' \
            | sort -t- -k2 -n -r | tail -n +4 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
