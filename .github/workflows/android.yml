name: Android Build

# Phobos is Android-only for now: build the release APKs (legacy + modern
# flavors) on every commit/PR, upload them as build artifacts, publish a GitHub
# Release when a version tag is pushed, and publish a nightly pre-release for
# every push to master. Every release carries update.json for the in-app updater.
#
# Only RELEASE builds are produced here — debug builds stay local/off-CI so
# nobody gets the dev build from GitHub.
#
# The release build type signs with android/keystore/release.keystore, which is
# committed with the default passwords in android/app/build.gradle.kts, so CI and
# local release APKs install over each other. That key is public; for private
# release signing, provide PHOBOS_KEYSTORE_FILE, PHOBOS_KEYSTORE_PASSWORD,
# PHOBOS_KEY_ALIAS and PHOBOS_KEY_PASSWORD from secrets (the build reads them).

on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]   # tag pushes also trigger so the release job can run
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APKs (legacy + modern)
    runs-on: ubuntu-latest
    steps:
      # The whole history, without file contents beyond this commit's: the build
      # numbers its version from the commit count and the latest tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # thirdparty/libadrenotools (public)
          fetch-depth: 0
          filter: blob:none

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # The NDK is ~1.5 GB; cache the whole SDK dir so repeat builds don't
      # re-download it. Keyed on the gradle build files + the component list.
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'android/gradle/libs.versions.toml') }}-ndk28

      # Pre-install the same components the local build uses (compileSdk 37,
      # build-tools 36, NDK 28.2, CMake 3.22.1). AGP auto-installs anything
      # extra it needs on top. NOTE: the platform-37 package id is
      # "platforms;android-37.0" (Android 17, API level 37.0) — not "android-37".
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # FFmpeg's decoders for the PSP (thirdparty/ffmpeg/build.sh, run by CMake): built from FFmpeg's release
      # once, then kept, as is the release's tarball.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('thirdparty/ffmpeg/build.sh') }}-ndk28

      # assembleRelease = assembleLegacyRelease + assembleModernRelease.
      # CMake builds the native lib (ares fork + libadrenotools) for arm64-v8a.
      # The version comes from git history (android/app/build.gradle.kts): the
      # tag on a tagged commit (v1.2.3 -> 1.2.3), otherwise "<tag>-<n>-g<hash>".
      - name: Build release APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # "Phobos-<version>-<Flavor>.apk" for each flavor (no zip: each is its own
      # file on the Release page), and update.json for the in-app updater.
      - name: Stage release APKs
        working-directory: android
        run: >-
          bash ../.github/scripts/stage-apks.sh app/build/outputs/apk dist
          ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'nightly' }} "$GITHUB_SHA"

      # FFmpeg's source, the release tarball the APKs' libavcodec and libavutil were built from, published with
      # them: the LGPL's terms for distributing its libraries (LICENSE, FFmpeg).
      - name: Stage FFmpeg's source
        run: cp .cache/ffmpeg/ffmpeg-*.tar.xz android/dist/

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: phobos-apks
          path: android/dist/*
          if-no-files-found: error

  # Publish a GitHub Release only for version tags (e.g. v1.0). Attaches the
  # two release APKs and update.json. Tag the repo with a version to cut a release.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: phobos-apks
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*
          generate_release_notes: true

  # Every push to master publishes a pre-release, nightly-<version code>, for the
  # in-app updater's nightly channel; nightlies beyond the newest three are
  # deleted with their tags.
  nightly:
    name: Publish nightly build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: phobos-apks
          path: apks

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(jq -r .versionCode apks/update.json)
          name=$(jq -r .versionName apks/update.json)
          if ! gh release view "nightly-$code" > /dev/null 2>&1; then
            gh release create "nightly-$code" apks/* --prerelease --target "$GITHUB_SHA" \
              --title "Nightly $name" \
              --notes "Built from $GITHUB_SHA on master. Nightly builds are less tested than releases."
          fi
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-"))) | .tagName' \
            | sort -t- -k2 -n -r | tail -n +4 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
