<text x="236.3" y="253.8" font-size="10.5" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">135</text>
<text x="431.4" y="204" font-size="10.5" fill="#1f2328" text-anchor="middle" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">505</text>
