<text x="64.8" y="248.3" font-size="11" fill="#59636e" text-anchor="end">250</text>
<line x1="72.8" y1="210.7" x2="856" y2="210.7" stroke="#e6e9ed" stroke-width="1"/>
<text x="64.8" y="214.7" font-size="11" fill="#59636e" text-anchor="end">500</text>
<line x1="72.8" y1="177" x2="856" y2="177" stroke="#e6e9ed" stroke-width="1"/>
<text x="64.8" y="181" font-size="11" fill="#59636e" text-anchor="end">750</text>
<line x1="72.8" y1="143.3" x2="856" y2="143.3" stroke="#e6e9ed" stroke-width="1"/>
<text x="64.8" y="147.3" font-size="11" fill="#59636e" text-anchor="end">1,000</text>
<line x1="72.8" y1="109.7" x2="856" y2="109.7" stroke="#e6e9ed" stroke-width="1"/>
<text x="64.8" y="113.7" font-size="11" fill="#59636e" text-anchor="end">1,250</text>
<line x1="72.8" y1="76" x2="856" y2="76" stroke="#e6e9ed" stroke-width="1"/>
<text x="64.8" y="80" font-size="11" fill="#59636e" text-anchor="end">1,500</text>
<text x="0" y="0" font-size="12" fill="#59636e" text-anchor="middle" transform="translate(20 177) rotate(-90)">Million PSP instructions a second</text>
<line x1="72.8" y1="233.2" x2="856" y2="233.2" stroke="#59636e" stroke-width="1.2" stroke-dasharray="5 4"/>
