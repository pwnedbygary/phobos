<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
<title id="title">The Allegrex CPU on the host: interpreter against recompiler</title>
<desc id="desc">On a Mac the interpreter runs 150 million PSP instructions a second, the recompiler 505, and the recompiler with its page table 1,206; in a Linux container 135, 219 and 1,212.</desc>
<rect x="0.5" y="0.5" width="879" height="359" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-size="15" fill="#1f2328" font-weight="600">The Allegrex CPU on the host: interpreter against recompiler</text>
<rect x="20" y="45" width="10" height="10" rx="2" fill="#0969da"/>
<text x="34" y="54" font-size="12" fill="#1f2328">Mac (ARM64)</text>
<rect x="133.8" y="45" width="10" height="10" rx="2" fill="#8c959f"/>
<text x="147.8" y="54" font-size="12" fill="#1f2328">Linux container (ARM64, 4 cores)</text>
<text x="20" y="332" font-size="11" fill="#59636e">Source: docs/psp-core.md, “The recompiler”: a benchmark loop of loads, stores and arithmetic, the test build at -O1. The page table lets compiled</text>
<text x="20" y="346" font-size="11" fill="#59636e">loads and stores reach RAM directly. Phobos counts one PSP cycle per instruction, at up to 333 MHz.</text>
<line x1="72.8" y1="278" x2="856" y2="278" stroke="#8c959f" stroke-width="1"/>
<text x="64.8" y="282" font-size="11" fill="#59636e" text-anchor="end">0</text>
