<text x="34" y="54" font-size="12" fill="#1f2328">Software, 1 thread</text>
<rect x="174.6" y="45" width="10" height="10" rx="2" fill="#0969da"/>
<text x="188.6" y="54" font-size="12" fill="#1f2328">Software, 7 threads</text>
<rect x="335.8" y="45" width="10" height="10" rx="2" fill="#1a7f37"/>
<text x="349.8" y="54" font-size="12" fill="#1f2328">Vulkan, first version</text>
<text x="20" y="402" font-size="11" fill="#59636e">Source: docs/psp-core.md part 36: frames a second from the same six scenes on the RP6&#39;s Adreno 740. Vulkan on one thread beat the seven-thread</text>
<text x="20" y="416" font-size="11" fill="#59636e">software renderer in all six; 28-65% of its pixels matched the software renderer&#39;s exactly, nearly all the rest within one or two levels.</text>
