<title id="title">The 266-game library run: how far each game got in one minute</title>
<desc id="desc">Stacked bars for 13 library runs from 7 to 11 October 2026: games at a menu or in gameplay rise from 141 to 197 of 266, and black or hung games fall from 73 to 1.</desc>
<rect x="0.5" y="0.5" width="879" height="359" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-size="15" fill="#1f2328" font-weight="600">The 266-game library run: how far each game got in one minute</text>
<rect x="20" y="45" width="10" height="10" rx="2" fill="#1a7f37"/>
<text x="34" y="54" font-size="12" fill="#1f2328">Menu or gameplay</text>
<rect x="163.3" y="45" width="10" height="10" rx="2" fill="#0969da"/>
<text x="177.3" y="54" font-size="12" fill="#1f2328">Movie</text>
<rect x="233.6" y="45" width="10" height="10" rx="2" fill="#8c959f"/>
<text x="247.6" y="54" font-size="12" fill="#1f2328">Stuck loading or timed out</text>
<rect x="430.6" y="45" width="10" height="10" rx="2" fill="#cf222e"/>
<text x="444.6" y="54" font-size="12" fill="#1f2328">Black or hung</text>
<text x="20" y="318" font-size="11" fill="#59636e">Source: docs/psp-compatibility.md. Each game runs headless for 3600 frames (a minute of PSP time), Start pressed at frame 120 and Cross at 1800,</text>
<text x="20" y="332" font-size="11" fill="#59636e">judged from four captures. Run 1 and parts 51-59: 9 Oct; parts 62 and 64: 10 Oct; the final run (v2.0.0) and parts 70-72: 11 Oct. The 7 Oct report&#39;s</text>
<text x="20" y="346" font-size="11" fill="#59636e">presses never reached the games (fixed in part 37).</text>
