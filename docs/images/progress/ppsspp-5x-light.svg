<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
<title id="title">At 5x on the RP6: PPSSPP against Phobos in the heavy games (16 Oct 2026)</title>
<desc id="desc">At 5x on the same RP6, PPSSPP on Qualcomm&#39;s driver runs all 11 heavy games at 59.8 to 60.0 fps, while Phobos on Turnip runs them at 2.9 to 52.9 fps.</desc>
<rect x="0.5" y="0.5" width="879" height="519" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-size="15" fill="#1f2328" font-weight="600">At 5x on the RP6: PPSSPP against Phobos in the heavy games (16 Oct 2026)</text>
<rect x="20" y="45" width="10" height="10" rx="2" fill="#0969da"/>
<text x="34" y="54" font-size="12" fill="#1f2328">PPSSPP 1.20.4 (Vulkan, Qualcomm&#39;s driver)</text>
<rect x="315.4" y="45" width="10" height="10" rx="2" fill="#bc4c00"/>
<text x="329.4" y="54" font-size="12" fill="#1f2328">Phobos (Vulkan fast, Turnip, nightly-215681)</text>
<text x="20" y="464" font-size="11" fill="#59636e">Source: the same Retroid Pocket 6 at 5x, but not the same driver: PPSSPP on Qualcomm&#39;s, Phobos on Turnip (on Activision Hits&#39; copyright screen at</text>
<text x="20" y="478" font-size="11" fill="#59636e">5x, Phobos&#39;s master ran 2.7 fps on Turnip and 12.9 on Qualcomm&#39;s driver; docs/psp-core.md part 102). PPSSPP&#39;s speed counter read from screenshots</text>
<text x="20" y="492" font-size="11" fill="#59636e">(frame skipping off), Phobos from its overnight 5x library run; mean fps after the first 18 s of 120 s runs with the same presses, so similar scenes</text>
<text x="20" y="506" font-size="11" fill="#59636e">rather than identical ones.</text>
