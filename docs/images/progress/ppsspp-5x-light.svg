<title id="title">At 5x on the RP6: PPSSPP against Phobos in the heavy games (16 Oct 2026)</title>
<desc id="desc">At 5x on the same RP6, PPSSPP runs all 11 heavy games at about 60 fps, while Phobos runs them at 2.9 to 52.9 fps.</desc>
