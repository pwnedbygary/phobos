<text x="209.9" y="54" font-size="12" fill="#1f2328">Phobos (Vulkan fast, nightly-215681)</text>
<text x="20" y="492" font-size="11" fill="#59636e">Source: both on the same Retroid Pocket 6 at 5x: PPSSPP&#39;s speed counter read from screenshots (frame skipping off), Phobos from its overnight 5x</text>
