<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
<title id="title">The 22 slow games on the RP6: how many average full speed at 1x</title>
<desc id="desc">Bars by build: 7 of the 22 slow games averaged full speed with v2.2.0 and 7 with v2.3.0, 15 with the 14 October nightly, and 18 and 18 with the two nightlies of 15 October.</desc>
