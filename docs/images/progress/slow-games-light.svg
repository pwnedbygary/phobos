<text x="20" y="332" font-size="11" fill="#59636e">Source: runs on a Retroid Pocket 6 (Snapdragon 8 Gen 2), Vulkan (fast) at native resolution: mean fps after the first 18 s of 150 s runs with scripted</text>
<text x="20" y="346" font-size="11" fill="#59636e">presses, samples capped at 60. nightly-215624 ran on the device&#39;s default performance profile.</text>
