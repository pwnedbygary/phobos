<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
<title id="title">At 5x on the RP6: what the frame rate depends on (16 Oct 2026)</title>
<desc id="desc">Six heavy scenes at 5x on the RP6: direct depth copies lift Activision Hits&#39; copyright screen from 2.7 to 19.3 fps, and dropping the shader&#39;s depth writes (inexact, a test only) doubles Chains of Olympus from 9.6 to 19.1.</desc>
<rect x="0.5" y="0.5" width="879" height="469" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="30" font-size="15" fill="#1f2328" font-weight="600">At 5x on the RP6: what the frame rate depends on (16 Oct 2026)</text>
<rect x="20" y="45" width="10" height="10" rx="2" fill="#8c959f"/>
<text x="34" y="54" font-size="12" fill="#1f2328">Before the changes</text>
<rect x="173.6" y="45" width="10" height="10" rx="2" fill="#0969da"/>
<text x="187.6" y="54" font-size="12" fill="#1f2328">Conservative depth</text>
<rect x="326.5" y="45" width="10" height="10" rx="2" fill="#1a7f37"/>
<text x="340.5" y="54" font-size="12" fill="#1f2328">Plus direct depth copies</text>
<rect x="508.6" y="45" width="10" height="10" rx="2" fill="#bc4c00"/>
<text x="522.6" y="54" font-size="12" fill="#1f2328">No depth writes in the shader (inexact test)</text>
<text x="20" y="428" font-size="11" fill="#59636e">Source: the headless runner on a Retroid Pocket 6 from saved scenes, Turnip driver, 5x (2400x1360), 150 frames as fast as possible, best of two</text>
<text x="20" y="442" font-size="11" fill="#59636e">rounds: experimental builds of 16 Oct, before #265 merged a depth declaration and the direct depth copies (#265&#39;s final build ran the copyright screen</text>
<text x="20" y="456" font-size="11" fill="#59636e">at 19.4 fps).</text>
