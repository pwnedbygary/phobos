<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
<title id="title">GE time for one display list: a real PSP against Phobos&#39;s timing model</title>
<desc id="desc">For the same scenes&#39; display lists, a PSP-1000&#39;s GE took 4.46 to 29.6 ms where Phobos&#39;s model charged 0.59 to 6.24 ms: 4 to 12 times less.</desc>
<rect x="0.5" y="0.5" width="879" height="399" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="20" y="30" font-size="15" fill="#e6edf3" font-weight="600">GE time for one display list: a real PSP against Phobos&#39;s timing model</text>
<rect x="20" y="45" width="10" height="10" rx="2" fill="#4493f8"/>
<text x="34" y="54" font-size="12" fill="#e6edf3">PSP-1000 (measured)</text>
<rect x="183.2" y="45" width="10" height="10" rx="2" fill="#db6d28"/>
<text x="197.2" y="54" font-size="12" fill="#e6edf3">Phobos&#39;s GE model</text>
<text x="20" y="372" font-size="11" fill="#9198a1">Source: a PSP-1000 measured with a GE profiler plugin under ARK custom firmware (16 Oct 2026), against the time Phobos&#39;s model charges for the</text>
<text x="20" y="386" font-size="11" fill="#9198a1">same scenes&#39; lists (the headless runner&#39;s --ge-profile from saved states, in draft pull request #266).</text>
